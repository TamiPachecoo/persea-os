<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nay Murta no Instagram</title>
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="2;url=https://www.instagram.com/naymurta/">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0908;color:#f2ece0;font:300 15px Poppins,system-ui,sans-serif}a{color:#dcc7a8}</style>
</head><body>
<p>Abrindo o Instagram da Nay… <a href="https://www.instagram.com/naymurta/">toque aqui se não abrir</a></p>
<script>
/* Tracked link to Nay's Instagram for e-mails and other campaigns:
   naymurta.com/ig/?utm_source=email&c=<campanha>
   Records one click in site_events (site-track → Relatórios → Site, label
   "Instagram · <origem> · <campanha>") and then opens her profile.
   No cookies and nothing personal, same as the rest of the site's counter. */
(function () {
  var IG = 'https://www.instagram.com/naymurta/';
  var q; try { q = new URLSearchParams(location.search); } catch (e) { q = { get: function () { return ''; } }; }
  var clean = function (v) { return String(v || '').replace(/[^\w\- .]/g, '').slice(0, 40); };
  var source = clean(q.get('utm_source')) || 'link';
  var campaign = clean(q.get('c') || q.get('utm_campaign'));
  var go = function () { location.replace(IG); };
  try {
    if (/(^|\.)naymurta\.com$/.test(location.hostname)) {
      fetch('https://bletlyuptkppacjcbcvw.supabase.co/functions/v1/site-track', {
        method: 'POST', keepalive: true,
        headers: { 'Content-Type': 'application/json', apikey: 'sb_publishable_37D7JJzhUDCUwtHtYA4gjw_jiSXDMxu' },
        body: JSON.stringify({ kind: 'click', label: 'Instagram · ' + source + (campaign ? ' · ' + campaign : ''), path: '/ig/', referrer: document.referrer, utm_source: source,
          session_id: Math.random().toString(36).slice(2) + Date.now().toString(36) })
      }).catch(function () {}).then(go, go);
      setTimeout(go, 800);
    } else { go(); }
  } catch (e) { go(); }
})();
</script>
</body></html>
